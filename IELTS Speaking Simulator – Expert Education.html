y\nPronunciation\nFluent with only very occasional repetition or\nself-correction.\nTotal flexibility and precise use in all contexts.\nStructures are precise and accurate at all times,\napart from \u2018mistakes\u2019 characteristic of native\nspeaker speech.\nUses a full range of phonological features to\nconvey precise and/or subtle meaning.\nAny hesitation that occurs is used only to\nprepare the content of the next utterance and\nnot to find words or grammar.\nSustained use of accurate and idiomatic\nlanguage.\nFlexible use of features of connected speech is\nsustained throughout.\nCan be effortlessly understood throughout.\nSpeech is situationally appropriate and\ncohesive features are fully acceptable.\nAccent has no effect on intelligibility.\nTopic development is fully coherent and\nappropriately extended.\n8\n7\nFluent with only very occasional repetition or\nself-correction.\nWide resource, readily and flexibly used to\ndiscuss all topics and convey precise meaning.\nHesitation may occasionally be used to find\nwords or grammar, but most will be content\nrelated.\nSkilful use of less common and idiomatic items\ndespite occasional inaccuracies in word choice\nand collocation.\nTopic development is coherent, appropriate\nand relevant.\nEffective use of paraphrase as required.\nAble to keep going and readily produce long\nturns without noticeable effort.\nResource flexibly used to discuss a variety of\ntopics.\nA range of structures flexibly used. Error-free\nsentences are frequent.\nSome hesitation, repetition and/or selfcorrection may occur, often mid-sentence and\nindicate problems with accessing appropriate\nlanguage. However, these will not affect\ncoherence.\nSome ability to use less common and idiomatic\nitems and an awareness of style and collocation\nis evident though inappropriacies occur.\nBoth simple and complex sentences are used\neffectively despite some errors. A few basic\nerrors persist.\nFlexible use of spoken discourse markers,\nconnectives and cohesive features.\nWide range of structures, flexibly used.\nThe majority of sentences are error free.\nOccasional inappropriacies and non-systematic\nerrors occur. A few basic errors may persist.\nUses a wide range of phonological features to\nconvey precise and/or subtle meaning.\nCan sustain appropriate rhythm. Flexible use of\nstress and intonation across long utterances,\ndespite occasional lapses.\nCan be easily understood throughout.\nAccent has minimal effect on intelligibility.\nEffective use of paraphrase as required.\nDisplays all the positive features of band 6, and\nsome, but not all, of the positive features of\nband 8.\n\fSpeaking Band Descriptors\nPlease visit IELTS.org for updates\nBand\nScore\nScoring criteria for Academic and General Training tests\nFluency and coherence\nLexical resource\nGrammatical range and\naccuracy\nPronunciation\nAble to keep going and demonstrates a willingness to\nproduce long turns.\nResource sufficient to discuss topics at length.\nProduces a mix of short and complex sentence forms\nand a variety of structures with limited flexibility.\nUses a range of phonological features, but control is\nvariable.\nThough errors frequently occur in complex structures,\nthese rarely impede communication.\nChunking is generally appropriate, but rhythm may be\naffected by a lack of stress-timing and/or a rapid speech\nrate.\nCoherence may be lost at times as a result of hesitation,\nrepetition and/or self-correction.\n6\nPage 2\nUses a range of spoken discourse markers, connectives\nand cohesive features though not always appropriately.\nVocabulary use may be inappropriate but meaning is\nclear.\nGenerally able to paraphrase successfully.\nSome effective use of intonation and stress, but this is\nnot sustained.\nIndividual words or phonemes may be mispronounced\nbut this causes only occasional lack of clarity.\nCan generally be understood throughout without much\neffort.\n5\nUsually able to keep going, but relies on repetition and\nself-correction to do so and/or on slow speech.\nResource sufficient to discuss familiar and unfamiliar\ntopics but there is limited flexibility.\nBasic sentence forms are fairly well controlled for\naccuracy.\nHesitations are often associated with mid-sentence\nsearches for fairly basic lexis and grammar.\nAttempts paraphrase but not always with success.\nComplex structures are attempted but these are limited\nin range, nearly always contain errors and may lead to\nthe need for reformulation.\nResource sufficient for familiar topics but only basic\nmeaning can be conveyed on unfamiliar topics.\nCan produce basic sentence forms and some short\nutterances are error-free.\nFrequent inappropriacies and errors in word choice.\nSubordinate clauses are rare and, overall, turns are\nshort, structures are repetitive and errors are frequent.\nOveruse of certain discourse markers, connectives and\nother cohesive features.\nDisplays all the positive features of band 4, and some,\nbut not all, of the positive features of band 6.\nMore complex speech usually causes disfluency but\nsimpler language may be produced fluently.\nUnable to keep going without noticeable pauses.\nSpeech may be slow with frequent repetition.\n4\nOften self-corrects.\nCan link simple sentences but often with repetitious use\nof connectives.\nSome breakdowns in coherence.\nRarely attempts paraphrase.\nUses some acceptable phonological features, but the\nrange is limited.\nProduces some acceptable chunking, but there are\nfrequent lapses in overall rhythm.\nAttempts to use intonation and stress, but control is\nlimited.\nIndividual words or phonemes are frequently\nmispronounced, causing lack of clarity.\nUnderstanding requires some effort and there may be\npatches of speech that cannot be understood.\n\fSpeaking Band Descriptors\nPlease visit IELTS.org for updates\nBand\nScore\nScoring criteria for Academic and General Training tests\n3\nPage 3\nFluency and coherence\nLexical resource\nGrammatical range and\naccuracy\nPronunciation\nFrequent, sometimes long, pauses occur while\ncandidate searches for words.\nResource limited to simple vocabulary used\nprimarily to convey personal information.\nDisplays some features of band 2, and some,\nbut not all, of the positive features of band 4.\nLimited ability to link simple sentences and go\nbeyond simple responses to questions.\nVocabulary inadequate for unfamiliar topics.\nBasic sentence forms are attempted but\ngrammatical errors are numerous except in\napparently memorised utterances.\nNo evidence of basic sentence forms.\nUses few acceptable phonological features\n(possibly because sample is insufficient).\nFrequently unable to convey basic message.\nLengthy pauses before nearly every word.\nIsolated words may be recognisable but speech\nis of virtually no communicative significance.\n2\nVery limited resource. Utterances consist of\nisolated words or memorised utterances.\nLittle communication possible without the\nsupport of mime or gesture.\nOverall problems with delivery impair attempts\nat connected speech.\nIndividual words and phonemes are mainly\nmispronounced and little meaning is conveyed.\nOften unintelligible.\n1\n0\nNotes:\nEssentially none.\nNo resource bar a few isolated words.\nSpeech is totally incoherent.\nNo communication possible.\nNo rateable language unless memorised.\nCan produce occasional individual words and\nphonemes that are recognisable, but no overall\nmeaning is conveyed.\nUnintelligible.\nDoes not attend / Does not complete the test\n(i) A candidate must fully fit the positive features of the descriptor at a particular level.\n(ii) A candidate will be rated on their average performance across all parts of the test.\n\f";

const I=['',"In Part 1, I'd like to ask you some questions about yourself.","Now, in Part 2, I'm going to give you a topic and I'd like you to talk about it for one to two minutes. First you have one minute to think about what you're going to say, and you can make notes. Here is your topic. ","Now, in Part 3, we've been talking about your topic, and I'd like to ask some more general questions related to it."][first?s.p:0];
$('tx').value='';S.q0=Date.now();$('cue').hidden=s.p!=2;$('nx').textContent='Next ▶';$('tx').placeholder='Your answer appears here (you can type or edit)';stat('Victoria is asking');
if(s.p==2){const c=s.c;$('cue').innerHTML='<b>'+E(c.topic)+'</b><ul>'+c.say.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul><i>'+E(c.explain)+'</i>';S.ph='wait';say(I+cueT(c),()=>{S.ph='prep';S.pe=Date.now()+6e4;stat('Preparing – 1 minute');$('tx').placeholder='Make short notes here…';$('nx').textContent='Start speaking ▶'})}
else{S.ph='';say(I+s.q,()=>{S.q0=Date.now();stat('Your turn');rec()})}}
function speak2(){S.ph='wait';stop();S.notes=$('tx').value;$('tx').value='';$('nx').textContent='Next ▶';$('tx').placeholder='Your answer appears here';stat('Victoria is speaking');
say('All right? Remember, you have one to two minutes for this, so don\'t worry if I stop you. Please start speaking now.',()=>{S.ph='talk';S.pe=Date.now()+12e4;S.q0=Date.now();stat('Speaking – up to 2 minutes');rec()})}
function tick(){const n=Date.now();if($('tot'))$('tot').textContent=f(n-S.t0);if(S.ph=='prep'||S.ph=='talk'){const r=S.pe-n;$('clock').textContent=f(Math.max(0,r));if(r<=0)S.ph=='prep'?speak2():next()}else $('clock').textContent=f(n-(S.q0||n))}
function save(){const s=S.steps[S.i];if(!s)return;S.log.push({p:s.p,q:s.q,a:$('tx').value.trim(),s:Math.round((Date.now()-S.q0)/1000)})}
function next(){if(S.ph=='wait')return;if(S.ph=='prep'){speak2();return}stop();S.sid++;const s=S.steps[S.i];save();S.ph='wait';S.i++;s.p==2?say('Thank you. That is the end of Part 2.',ask):ask()}
function finish(){clearInterval(S.iv);stop();S.ph='wait';S.end=tm();S.dur=f(Date.now()-S.t0);say(`Thank you. That is the end of the speaking test. The time is ${S.end}.`,()=>{$('run').hidden=1;analyse()})}
async function analyse(){const R=$('res');S.busy=1;R.hidden=0;$('run').hidden=1;const w=S.log.reduce((n,x)=>n+(x.a?x.a.split(/\s+/).length:0),0);
const again='<p><button class="pri" onclick="$(\'res\').hidden=1;$(\'home\').hidden=0">Practise again</button></p>';
R.innerHTML='<h2>Victoria is marking your test…</h2><p class="mu">This can take up to a minute.</p>';
if(w<8){S.busy=0;R.innerHTML='<h2>Not enough speech to mark</h2><p>Please try again and allow the microphone, or type your answers.</p>'+again;return}
const sm=window.claude?await claude.use('sample'):null;if(!sm){S.busy=0;R.innerHTML='<h2>Scoring unavailable</h2><p>Open this page from claude.ai and allow Claude scoring.</p>'+again;return}
const P=`You are a strict, realistic IELTS Speaking examiner. Candidate target band: ${S.t}. Mark ONLY with these official band descriptors:\n${DESC}\n\nTranscripts come from speech recognition (ignore punctuation/capitalisation and recognition glitches). Seconds spoken per answer are given. Part 1 = short answers, Part 2 = 1–2 minute monologue (under 1 minute loses marks), Part 3 = extended discussion. Pronunciation cannot be heard: estimate cautiously from transcript clues and say so.\n\n`+S.log.map(x=>`[Part ${x.p}, ${x.s}s] Q: ${x.q}\nA: ${x.a||'(no answer)'}`).join('\n\n')+`\n\nReturn ONLY JSON: {"criteria":{"fc":{"band":6,"why":"","evidence":""},"lr":{...},"gra":{...},"pr":{...}},"strengths":["",""],"fixes":[{"said":"exact words from transcript","better":"corrected/upgraded version","why":"rule or descriptor involved","effect":"how this change moves the band"}],"plan":["steps to reach the target ${S.t}"],"better_answer":{"q":"","text":"a model answer to the weakest question at the target level","band":7}}. Criterion bands are whole numbers 0–9. Give 4–6 fixes.`;
try{S.res=await sm.json(P,{cache:false});S.busy=0;draw()}catch(e){S.busy=0;R.innerHTML='<h2>Could not mark the test</h2><p>'+E(e.message||e.code||'Error')+'</p><p><button class="pri" onclick="analyse()">Try again</button></p>'+again}}
function draw(){const r=S.res,c=r.criteria||{},K=[['fc','Fluency & Coherence'],['lr','Lexical Resource'],['gra','Grammatical Range & Accuracy'],['pr','Pronunciation (estimated)']];
const bs=K.map(([k])=>+(c[k]||{}).band||0),ov=Math.round(bs.reduce((a,b)=>a+b,0)/4*2)/2,g=S.t-ov;
const vd=g<=0?['ok','You are performing at your target band. Keep consistent across all parts, and consider aiming higher.']:g<=.5?['mid','Close – half a band away. Targeted fixes below should get you there.']:['lo',`Not ready yet – ${g.toFixed(1)} bands below target. Work through the plan below before booking the test.`];
const weak=K.filter((_,i)=>bs[i]<S.t).map(([,n])=>n);const p2=S.log.find(x=>x.p==2);
$('res').innerHTML=`<div class="row" style="align-items:center;gap:20px"><div><div class="mu">Overall band</div><div class="big">${ov.toFixed(1)}</div></div><div><b>Target ${S.t.toFixed(1)}</b> <select id="tg2">${BS.map(b=>`<option>${b.toFixed(1)}</option>`).join('')}</select><div class="${vd[0]}"><b>${vd[1]}</b></div></div></div>
<p><small>Started ${S.st||''} · Ended ${S.end||''} · Duration ${S.dur||''}${p2&&p2.s<60?` · <span class="lo">Part 2 lasted only ${p2.s}s – under 1 minute loses marks</span>`:''}</small></p>
${weak.length?`<p class="mu">Criteria below your target: <b>${weak.map(E).join(', ')}</b></p>`:''}
<h2>Scores against the band descriptors</h2><div class="cr">${K.map(([k,n],i)=>`<div><b>${n}</b><div class="big" style="font-size:1.8rem">${bs[i]}</div><div class="bar"><i style="width:${bs[i]/9*100}%"></i></div><p>${E((c[k]||{}).why)}</p><small>Evidence: ${E((c[k]||{}).evidence)}</small></div>`).join('')}</div>
<h2>What you did well</h2><ul>${(r.strengths||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul>
<h2>Corrections and why they matter</h2>${(r.fixes||[]).map(x=>`<div class="fx"><div class="bad">✗ ${E(x.said)}</div><div class="good">✓ ${E(x.better)}</div><p><b>Why:</b> ${E(x.why)}<br><b>Effect on your band:</b> ${E(x.effect)}</p></div>`).join('')}
<h2>Plan for target ${S.t.toFixed(1)}</h2><ol>${(r.plan||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ol>
${r.better_answer?`<h2>Sample answer (about band ${E(r.better_answer.band)})</h2><p><i>${E(r.better_answer.q)}</i></p><p>${E(r.better_answer.text)}</p>`:''}
<p><small>Pronunciation is estimated from text only; ask a teacher to confirm it. Changing the target above refreshes the advice.</small></p>
<p><button class="pri" onclick="$('res').hidden=1;$('home').hidden=0">Practise again</button></p>`;
$('tg2').value=S.t.toFixed(1);$('tg2').onchange=e=>setT(+e.target.value)}
</script></body></html>
